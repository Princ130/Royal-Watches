<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Login</title>
    <link rel="stylesheet" href="signup.css">
</head>


<body>
    <div class="container">
        <div class="form-container">
            <h1>Welcome Back</h1>

            <!-- Login Form -->
            <form id="loginForm" class="form active">
                <input type="email" placeholder="Email" required>
                <input type="password" placeholder="Password" required>
                <button type="submit">Login</button>
                <button><a href="dashboard.html"> Visitor login</a></button>
                <p class="toggle-text">New to us? <span onclick="showForm('signup')">Signup here</span></p>
            </form>

            <hr><a href="signup.html" class="cart-btn">Create an account</a>
        </div>
    </div>

    <script src="login signup.js"></script>
</body>
</html>
