<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Login & Signup</title>
    <link rel="stylesheet" href="signup.css">
</head>
<body>
    <div class="container">
        <div class="form-container">
            <h1>Who are you ?</h1>

            <!-- Login Form -->
            <form id="loginForm" class="form">
                <input type="email" placeholder="Email" required>
                <input type="password" placeholder="Password" required>
                <button type="submit">Login</button>
                <p class="toggle-text">new to me? <span onclick="showForm('signup')">Signup first</span></p>
            </form>

            <!-- Signup Form -->
            <form id="signupForm" class="form active">
                <input type="text" placeholder="Full Name" required>
                <input type="email" placeholder="Email" required>
                <input type="password" placeholder="Password" required>
                <button type="submit">Signup</button>
                <p class="toggle-text">you were scrolling without logging in?you are getting lazy *-*

            </form>


            <hr><a href="login.html" class="cart-btn">I already have an account</a>
        </div>
    </div>

    <script src="login signup.js"></script>
</body>
</html>
